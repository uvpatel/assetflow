name: Feature Request
description: Propose a new feature or enhancement for AssetFlow
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: As a [role], I want [capability] so that [business value].
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Bullet points defining when this issue is considered complete.
    validations:
      required: true

  - type: textarea
    id: authorization
    attributes:
      label: Authorization & Security Rules
      description: Which roles are permitted to invoke this functionality? Cross-tenant rules?
    validations:
      required: true

  - type: textarea
    id: technical-impact
    attributes:
      label: Technical & API Impact
      description: Affected modules, database changes (Flyway), API routes, domain events.

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Tests required (Unit/Integration/E2E), OpenAPI docs updated, ArchUnit rules pass.
    validations:
      required: true
